    <button class="cmd icon-only" id="btnCopy" title="복사 (⌘C)"><svg class="ic"><use href="#i-copy"/></svg></button>
    <button class="cmd icon-only" id="btnPaste" title="붙여넣기 (⌘V)"><svg class="ic"><use href="#i-paste"/></svg></button>
    <button class="cmd icon-only" id="btnRename" title="이름 바꾸기 (F2)"><svg class="ic"><use href="#i-rename"/></svg></button>
    <button class="cmd icon-only" id="btnTrash" title="삭제 (⌘⌫)"><svg class="ic"><use href="#i-trash"/></svg></button>
    <div class="vsep"></div>
    <button class="cmd" id="btnSort"><svg class="ic"><use href="#i-sort"/></svg><span>정렬</span><svg class="ic sm"><use href="#i-chev-d"/></svg></button>
    <button class="cmd" id="btnView"><svg class="ic"><use href="#i-view"/></svg><span>보기</span><svg class="ic sm"><use href="#i-chev-d"/></svg></button>
    <button class="cmd hidden" id="btnGit"><svg class="ic"><use href="#i-branch"/></svg><span>Git</span><svg class="ic sm"><use href="#i-chev-d"/></svg></button>
    <button class="cmd hidden" id="btnSvn"><svg class="ic"><use href="#i-branch"/></svg><span>SVN</span><svg class="ic sm"><use href="#i-chev-d"/></svg></button>
    <div class="spacer"></div>
    <button class="cmd" id="btnPreview" title="미리 보기 창"><svg class="ic"><use href="#i-eye"/></svg><span>미리 보기</span></button>
  </div>

  <!-- ══ Navigation bar ══ -->
  <div id="navbar">
    <button class="nav-btn" id="btnBack" title="뒤로 (⌘[)" disabled><svg class="ic"><use href="#i-back"/></svg></button>
    <button class="nav-btn" id="btnFwd" title="앞으로 (⌘])" disabled><svg class="ic"><use href="#i-fwd"/></svg></button>
    <button class="nav-btn" id="btnUp" title="상위 폴더 (⌫)"><svg class="ic"><use href="#i-up"/></svg></button>
    <button class="nav-btn" id="btnRefresh" title="새로 고침 (F5)"><svg class="ic"><use href="#i-refresh"/></svg></button>
    <div id="addressbar">
      <div id="breadcrumbs"></div>
      <input id="addressInput" type="text" spellcheck="false" autocomplete="off">
    </div>
    <div id="searchbox">
      <svg class="ic sm"><use href="#i-search"/></svg>
      <input id="searchInput" type="text" placeholder="검색" spellcheck="false">
      <button id="searchClear" class="hidden" title="지우기"><svg class="ic sm"><use href="#i-x"/></svg></button>
    </div>
  </div>

  <!-- ══ Body: sidebar | files | preview ══ -->
  <div id="body">
    <div id="sidebar">
      <div class="side-group" id="sidePlaces">
        <div class="side-head" data-target="sidePlacesList"><svg class="ic sm chev"><use href="#i-chev-d"/></svg>즐겨찾기</div>
        <div id="sidePlacesList"></div>
        <div id="sideFavsList"></div>
        <div id="sideLinksList"></div>
      </div>
      <div class="side-group">
        <div class="side-head" data-target="sideTreeList"><svg class="ic sm chev"><use href="#i-chev-d"/></svg>내 Mac</div>
        <div id="sideTreeList"></div>
      </div>
      <div class="side-group" id="sideVolumesGroup">
        <div class="side-head" data-target="sideVolumesList"><svg class="ic sm chev"><use href="#i-chev-d"/></svg>볼륨<button id="sideVolAdd" title="네트워크 드라이브 연결 (smb://)"><svg class="ic sm"><use href="#i-new"/></svg></button></div>
        <div id="sideVolumesList"></div>
      </div>
      <div class="side-group" id="sideNetGroup">
        <div class="side-head" data-target="sideNetList"><svg class="ic sm chev"><use href="#i-chev-d"/></svg>네트워크</div>
        <div id="sideNetList"></div>
      </div>
    </div>
    <div id="sidebarResizer"></div>

    <div id="main">
      <div id="colHeader" class="hidden">
        <div class="col col-name" data-key="name">이름 <span class="arrow"></span></div>
        <div class="col col-date" data-key="mtime">수정한 날짜 <span class="arrow"></span></div>
        <div class="col col-type" data-key="type">유형 <span class="arrow"></span></div>
        <div class="col col-size" data-key="size">크기 <span class="arrow"></span></div>
      </div>
      <div id="fileArea" tabindex="0">
        <div id="fileList"></div>
        <div id="emptyMsg" class="hidden">이 폴더는 비어 있습니다.</div>
        <div id="rubber" class="hidden"></div>
      </div>
      <div id="statusbar">
        <span id="statCount"></span>
        <span id="statSel"></span>
        <span id="statVcs"></span>
        <div class="spacer"></div>
        <span id="statDisk"></span>
        <span id="statPath"></span>
        <span id="statVer" title="클릭: 업데이트 확인"></span>
      </div>
    </div>

    <div id="previewResizer" class="hidden"></div>
    <div id="preview" class="hidden">
      <div id="previewContent"><div class="pv-empty">파일을 선택하면 미리 보기가 표시됩니다.</div></div>
      <div id="previewInfo"></div>
    </div>
  </div>
</div>

<!-- context menu / dropdowns / dialogs -->
<div id="ctxmenu" class="menu hidden"></div>
<div id="dropdown" class="menu hidden"></div>

<div id="modalWrap" class="hidden">
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div id="modalTitle"></div>
    <div id="modalBody"></div>
    <div id="modalBtns"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<!-- 미디어 뷰어 (전용 창 모드) -->
<div id="viewer" class="hidden">
  <div id="viewerBar">
    <button id="vwPrev" title="이전 (←)"><svg class="ic"><use href="#i-back"/></svg></button>
    <button id="vwNext" title="다음 (→)"><svg class="ic"><use href="#i-fwd"/></svg></button>
    <span id="vwName"></span>
    <span id="vwCount"></span>
    <span class="spacer"></span>
    <button id="vwZoomOut" title="축소 (-)">−</button>
    <span id="vwZoom">맞춤</span>
    <button id="vwZoomIn" title="확대 (+)">＋</button>
    <button id="vwFit" title="화면 맞춤 (0)">맞춤</button>
    <button id="vwOrig" title="실제 크기 (1)">1:1</button>
    <button id="vwRot" title="회전 (R)"><svg class="ic sm"><use href="#i-refresh"/></svg></button>
    <button id="vwOpen" title="기본 앱으로 열기"><svg class="ic sm"><use href="#i-folder-open"/></svg></button>
  </div>
  <div id="viewerCanvas"></div>
</div>

<script src="vendor/highlight.min.js"></script>
<script src="vendor/hljs-dos.min.js"></script>
<script src="vendor/hljs-powershell.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
